<style>

:root{--bg:#fafaf8;--fg:#1d1f24;--mut:#5b6068;--line:#d9d9d4;--card:#fff;--acc:#1b4f9c;--tab:#eceae4}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(340px,.8fr);grid-template-rows:auto 1fr;height:100vh}

.by{color:var(--mut);font-size:12px;font-weight:400}h1 .by{margin-left:6px}
ul.kf{margin:4px 0 12px;padding-left:20px}ul.kf li{margin:3px 0}h3.kf{margin-top:8px}
nav{display:flex;flex-wrap:wrap;gap:4px;padding-bottom:8px}

#map{min-height:0;background:#e9eef2}
#panel{overflow:auto;padding:12px 18px 40px;border-left:1px solid var(--line)}
#panel h2{font-size:19px;margin:6px 0 8px}#panel h3{font-size:15px;margin:16px 0 6px}
a{color:var(--acc)}code{font-size:.9em}
.note{color:var(--mut);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.card b{display:block;font-size:20px}.card span{font-size:12.5px;color:var(--mut)}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
td:not(:first-child),th:not(:first-child){text-align:right}table.checks td:last-child{text-align:left}
.radios{display:flex;flex-direction:column;gap:3px;margin:8px 0;font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px}
.chart svg{width:100%;height:auto;max-width:560px}
.chart .gr{stroke:var(--line);stroke-width:.6}.chart .tk,.chart .gt,.chart .ax{fill:var(--mut);font-size:10px}
.chart .gl{stroke:#888;stroke-width:1}.chart .go{stroke:#888;stroke-width:1;stroke-dasharray:4 3}

.legend{background:rgba(255,255,255,.92);color:#1d1f24;padding:6px 9px;border-radius:6px;font-size:12px;line-height:1.35;max-width:230px}
.legend .bar{height:10px;width:180px;border:1px solid #888;margin:3px 0}.legend .sw{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-2px;border:1px solid #777}
.legend .row{white-space:nowrap}.legend .lr{display:flex;justify-content:space-between;width:180px}
.bm{background:rgba(255,255,255,.92);color:#1d1f24;padding:5px 8px;border-radius:6px;font-size:12px}
.bm label{display:block}
.leaflet-popup-content{font-size:13px;margin:10px 12px}.leaflet-popup-content table{font-size:12px}
#app.nomap{grid-template-columns:minmax(0,1fr)}

#app.nomap #panel{border-left:0;padding:12px clamp(16px,4vw,56px) 40px}

#app{display:block;height:auto}

/228941452"],[23.55972,58.93946,"osm",13,"no_etak_tag","way/228952808"],[23.52797,58.93592,"osm",13,"no_etak_tag","way/228955321"],[23.55145,58.9413,"osm",13,"no_etak_tag","way/228957692"],[23.5334,58.9319,"osm",13,"no_etak_tag","way/228957768"],[23.55661,58.93907,"osm",13,"no_etak_tag","way/228976440"],[23.56477,58.93932,"osm",13,"no_etak_tag","way/228986500"],[23.50642,58.93377,"osm",13,"no_etak_tag","way/234406790"],[23.54907,58.92776,"osm",13,"no_etak_tag","way/246037958"],[23.51729,58.93978,"osm",13,"no_etak_tag","way/248224691"],[23.52989,58.93563,"osm",10,"no_etak_tag","way/295826521"],[23.5336,58.94275,"osm",13,"no_etak_tag","way/303729659"],[23.53875,58.93969,"osm",13,"no_etak_tag","way/346885457"],[23.53531,58.94764,"osm",13,"no_etak_tag","way/397213066"],[23.55285,58.92897,"osm",13,"no_etak_tag","way/399176156"],[23.54199,58.95031,"osm",10,"no_etak_tag","way/463587485"],[23.56492,58.93656,"osm",10,"no_etak_tag","way/699725078"],[23.54252,58.93287,"osm",10,"no_etak_tag","way/699747575"],[23.5365,58.94022,"osm",13,"no_etak_tag","way/704177200"],[23.52548,58.93197,"osm",13,"no_etak_tag","way/710521275"],[23.533,58.95186,"osm",13,"no_etak_tag","way/711603085"],[23.53118,58.94811,"osm",13,"no_etak_tag","way/711809713"],[23.53099,58.92945,"osm",13,"no_etak_tag","way/743087765"],[23.53729,58.93145,"osm",13,"no_etak_tag","way/744970382"],[23.53701,58.94501,"osm",13,"no_etak_tag","way/744991748"],[23.56532,58.93674,"osm",10,"no_etak_tag","way/768843264"]],"text":{"overview":"\n<h2>Haapsalu urban blocks<\/h2>\n<h3 class=\"kf\">Key findings<\/h3>\n<ul class=\"kf\"><li>Building-only population estimate is 1.73–2.52× the census (24 % of dwelling floor area vacant is one known reason)<\/li><li>Floors: 75.7 % of official buildings vs 3.6 % in OSM<\/li><li>64 OSM buildings carry an ETAK id absent from current official data (possibly demolished, not verified)<\/li><li>Shared foot/cycle paths shorten walking time by more than 2 min for 13.5 % of block pairs<\/li><li>All children aged 7-15 live within 30 min walk of a municipal basic school; the PGS § 7 (3) 60-minute rule is met (walking assumed)<\/li><\/ul>\n<p>Haapsalu (Estonia) cut into <b>297<\/b> urban blocks along OpenStreetMap roads and water with\n<a href=\"https://github.com/aimclub/blocksnet\">BlocksNet<\/a>, and described by land use, population, building density,\nwalking accessibility and access to schools. A second question compares OpenStreetMap buildings with the official\nEstonian building data. Choose a tab above; click a block on the map for its numbers.<\/p>\n<div class=\"cards\">\n<div class=\"card\"><b>9,595<\/b><span>inhabitants, census 2021 (distributed over the blocks)<\/span><\/div>\n<div class=\"card\"><b>297<\/b><span>urban blocks; 222 with buildings<\/span><\/div>\n<div class=\"card\"><b>3,941 / 3,885<\/b><span>buildings: official / OpenStreetMap<\/span><\/div>\n<div class=\"card\"><b>891<\/b><span>children aged 7-15 (census 2021), distributed<\/span><\/div>\n<div class=\"card\"><b>880<\/b><span>pupils in the two basic schools, 2026<\/span><\/div>\n<div class=\"card\"><b>97.0 %<\/b><span>official buildings with an OSM pair<\/span><\/div>\n<\/div>\n<p>The 2 blocks outlined in blue are large (over 1 km&sup2;); their values are less\nmeaningful (see <i>Methods &amp; limitations<\/i>). 9 islands and 92 slivers without buildings\nwere dropped from the blocks (kept in separate files).<\/p>\n<p class=\"note\">The grey outline is the settlement boundary of Haapsalu linn (EHAK). This is a self-study project; the\nnumbers are results of a model with the stated assumptions (tab <i>Methods &amp; limitations<\/i>), not official statistics.<\/p>\n<p class=\"by\">Aleksandra Nabiulina · self-study project · October 2026 · GitHub: <a href=\"https://github.com/aleks-nab/haapsalu-urban-blocks\">https://github.com/aleks-nab/haapsalu-urban-blocks<\/a><\/p>\n","landuse":"\n<h2>Land use<\/h2>\n<p>Each block gets the class with the largest share of its parcels' area, taken from the <b>cadastral land-use purpose\n(legal), not the actual use of the land<\/b>. If the largest class covers less than 50 % of the\nparcels the block is <i>mixed<\/i>.<\/p>\n<div class=\"tw\"><table class=\"\"><thead><tr><th>Class<\/th><th>Blocks<\/th><th>Population<\/th><th>Share of population<\/th><th>Area, km²<\/th><\/tr><\/thead><tbody><tr><td>residential<\/td><td>152<\/td><td>6,684<\/td><td>69.7 %<\/td><td>2.08<\/td><\/tr><tr><td>recreation<\/td><td>33<\/td><td>1,229<\/td><td>12.8 %<\/td><td>6.99<\/td><\/tr><tr><td>transport<\/td><td>32<\/td><td>45<\/td><td>0.5 %<\/td><td>0.05<\/td><\/tr><tr><td>mixed<\/td><td>30<\/td><td>1,360<\/td><td>14.2 %<\/td><td>1.23<\/td><\/tr><tr><td>business<\/td><td>27<\/td><td>274<\/td><td>2.9 %<\/td><td>0.28<\/td><\/tr><tr><td>industrial<\/td><td>21<\/td><td>4<\/td><td>0.0 %<\/td><td>0.15<\/td><\/tr><tr><td>special<\/td><td>2<\/td><td>0<\/td><td>0.0 %<\/td><td>0.01<\/td><\/tr><\/tbody><\/table><\/div>\n<p>30.3 % of the population lives in blocks whose class is not <i>residential<\/i> (this includes the mixed blocks).<\/p>\n<p class=\"note\">The cadastre says what a parcel may be used for; a parcel can be a house plot of a business class or the\nother way round. OpenStreetMap land use is not used.<\/p>\n","population":"\n<h2>Population<\/h2>\n<p>People per hectare of block area. The census total of Haapsalu linn (9,595 people, 2021) is\n<b>distributed<\/b> over the blocks in proportion to the registry net floor area of their dwellings; it is not a count\nper block. 186 blocks have population, the others have no dwellings.<\/p>\n<p>Among the blocks with population (without the large blocks) the density is between 0.1 and\n355.3 people per hectare, median 25.1. The scale on the map is clipped at the 95th\npercentile (190).<\/p>\n<p>For comparison, the same population estimated from floor area gives a much higher number: registry net area of\ndwellings divided by 29.9 m&sup2; per person\n(Statistics Estonia, census 2021) gives 16,581 people\n(1.73 times the census); footprint &times; floors gives\n24,189 (2.52 times). This is why the census total is\ndistributed instead.<\/p>\n","density":"\n<h2>Building density<\/h2>\n<p>Map: <b>fsi<\/b>, floor space index = floor area of all official buildings / block area (floors from the register,\nelse height / 3 m, else 1; 24.3 % of the buildings have no floors in the\nregister). The scale is clipped at the 95th percentile (1.14). Blocks without buildings are grey.<\/p>\n<p>Chart: Spacematrix of the 215 blocks with buildings, coloured by land-use class.\n<b>gsi<\/b> = footprint / block area; <b>L<\/b> = fsi / gsi, the mean number of floors; <b>OSR<\/b> = (1 &minus; gsi) / fsi,\nopen space per m&sup2; of floor area. Solid lines: constant L; dashed: constant OSR. Click a dot to find its block.<\/p>\n<div class=\"chart\"><svg viewBox=\"0 0 520 340\" role=\"img\" aria-label=\"Spacematrix: fsi against gsi of the blocks\"><line class=\"gr\" x1=\"46.0\" y1=\"300.0\" x2=\"46.0\" y2=\"12.0\"/><text class=\"tk\" x=\"46.0\" y=\"314\" text-anchor=\"middle\">0.0<\/text><line class=\"gr\" x1=\"112.0\" y1=\"300.0\" x2=\"112.0\" y2=\"12.0\"/><text class=\"tk\" x=\"112.0\" y=\"314\" text-anchor=\"middle\">0.1<\/text><line class=\"gr\" x1=\"178.0\" y1=\"300.0\" x2=\"178.0\" y2=\"12.0\"/><text class=\"tk\" x=\"178.0\" y=\"314\" text-anchor=\"middle\">0.2<\/text><line class=\"gr\" x1=\"244.0\" y1=\"300.0\" x2=\"244.0\" y2=\"12.0\"/><text class=\"tk\" x=\"244.0\" y=\"314\" text-anchor=\"middle\">0.3<\/text><line class=\"gr\" x1=\"310.0\" y1=\"300.0\" x2=\"310.0\" y2=\"12.0\"/><text class=\"tk\" x=\"310.0\" y=\"314\" text-anchor=\"middle\">0.4<\/text><line class=\"gr\" x1=\"376.0\" y1=\"300.0\" x2=\"376.0\" y2=\"12.0\"/><text class=\"tk\" x=\"376.0\" y=\"314\" text-anchor=\"middle\">0.5<\/text><line class=\"gr\" x1=\"442.0\" y1=\"300.0\" x2=\"442.0\" y2=\"12.0\"/><text class=\"tk\" x=\"442.0\" y=\"314\" text-anchor=\"middle\">0.6<\/text><line class=\"gr\" x1=\"508.0\" y1=\"300.0\ cy=\"247.5\" r=\"3.2\" fill=\"#9b51e0\" data-id=\"289\" tabindex=\"0\"><title>Block 289: gsi 0.210, fsi 0.410<\/title><\/circle><circle class=\"pt\" cx=\"288.9\" cy=\"197.6\" r=\"3.2\" fill=\"#d9d2c3\" data-id=\"290\" tabindex=\"0\"><title>Block 290: gsi 0.368, fsi 0.800<\/title><\/circle><circle class=\"pt\" cx=\"321.9\" cy=\"218.2\" r=\"3.2\" fill=\"#9b51e0\" data-id=\"291\" tabindex=\"0\"><title>Block 291: gsi 0.418, fsi 0.639<\/title><\/circle><circle class=\"pt\" cx=\"119.9\" cy=\"285.7\" r=\"3.2\" fill=\"#9b51e0\" data-id=\"292\" tabindex=\"0\"><title>Block 292: gsi 0.112, fsi 0.112<\/title><\/circle><circle class=\"pt\" cx=\"119.9\" cy=\"272.7\" r=\"3.2\" fill=\"#eb5757\" data-id=\"294\" tabindex=\"0\"><title>Block 294: gsi 0.112, fsi 0.213<\/title><\/circle><circle class=\"pt\" cx=\"180.0\" cy=\"274.0\" r=\"3.2\" fill=\"#2d9cdb\" data-id=\"295\" tabindex=\"0\"><title>Block 295: gsi 0.203, fsi 0.203<\/title><\/circle><circle class=\"pt\" cx=\"149.6\" cy=\"263.5\" r=\"3.2\" fill=\"#2d9cdb\" data-id=\"296\" tabindex=\"0\"><title>Block 296: gsi 0.157, fsi 0.285<\/title><\/circle><circle class=\"pt\" cx=\"472.4\" cy=\"134.6\" r=\"3.2\" fill=\"#9b51e0\" data-id=\"297\" tabindex=\"0\"><title>Block 297: gsi 0.646, fsi 1.292<\/title><\/circle><\/svg><\/div>\n<p class=\"note\">Large blocks are shown larger. A block with one small building has a very high OSR (up to\n13,715); this is why OSR is not mapped.<\/p>\n","access":"\n<h2>Walking accessibility<\/h2>\n<p>For each block: the <b>median walking time<\/b> from its point to all the other blocks, on the OpenStreetMap walking\nnetwork at 5 km/h. City median 19.6 min; blocks range from 13.4 to\n56.0 min. The scale is clipped at the 98th percentile (43 min).<\/p>\n<p class=\"note\">5 km/h is a conditional assumption. The block point is the representative point of the\nblock; in the large blocks it can fall in a forest.<\/p>\n","schools":"\n<h2>Schools<\/h2>\n<p>The map shows what you choose:<\/p>\n<div class=\"radios\">\n<label><input type=\"radio\" name=\"schoolmode\" value=\"time\" checked> walking time to the nearest basic school<\/label>\n<label><input type=\"radio\" name=\"schoolmode\" value=\"10\"> served within 10 min<\/label><label><input type=\"radio\" name=\"schoolmode\" value=\"15\"> served within 15 min<\/label><label><input type=\"radio\" name=\"schoolmode\" value=\"20\"> served within 20 min<\/label>\n<\/div>\n<p><b>Basic schools<\/b> (red stars) are the two municipal schools of the main calculation; their places\n(880) are the pupils of grades 1-9 on 1 October 2026. Black triangles are other schools, shown for\ninformation. The 891 children aged 7-15 of the census 2021 are distributed over the blocks in proportion\nto the population. Walking time to the nearest basic school: median 11.4 min, longest 49.7 min\n(block 3).<\/p>\n<h3>Children within a walking time<\/h3>\n<div class=\"tw\"><table class=\"\"><thead><tr><th>Walking time<\/th><th>Children<\/th><th>Share of the children<\/th><th>Blocks<\/th><\/tr><\/thead><tbody><tr><td>10 min<\/td><td>377<\/td><td>42.3 %<\/td><td>127<\/td><\/tr><tr><td>15 min<\/td><td>669<\/td><td>75.1 %<\/td><td>192<\/td><\/tr><tr><td>20 min<\/td><td>850<\/td><td>95.4 %<\/td><td>239<\/td><\/tr><tr><td>30 min<\/td><td>891<\/td><td>100.0 %<\/td><td>284<\/td><\/tr><tr><td>60 min<\/td><td>891<\/td><td>100.0 %<\/td><td>297<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The Basic Schools and Upper Secondary Schools Act (PGS &sect; 7 (3)) says, in short, that at least 80 % of the pupils\nfor whom a school is the home school must reach it within 60 minutes (paraphrase; it does not say how the way is made, here:\non foot). 100.0 % of the children are within 60 minutes of the nearest basic school.<\/p>\n<h3>Provision with BlocksNet <code>competitive_provision<\/code><\/h3>\n<div class=\"tw\"><table class=\"\"><thead><tr><th>Threshold<\/th><th>Provision (strong), town<\/th><th>Blocks with children not fully served<\/th><\/tr><\/thead><tbody><tr><td>10 min<\/td><td>0.423<\/td><td>89 of 173<\/td><\/tr><tr><td>15 min<\/td><td>0.751<\/td><td>43 of 173<\/td><\/tr><tr><td>20 min<\/td><td>0.921<\/td><td>32 of 173<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"note\">The places are the pupils of 2026, not the capacity of the schools, so the result shows how the schools\nare placed relative to the children, not whether there are enough places. Haapsalu Linna Algkool teaches grades 1-6\nonly. Some children go to schools outside the town or to the excluded schools.<\/p>\n","q2":"\n<h2>Q2: official buildings in OpenStreetMap<\/h2>\n<p>What is missing or outdated in OpenStreetMap when compared with the official building data? A pair is an official\nand an OSM building whose overlap is more than 50 % of the smaller one. Only numbers here.<\/p>\n<div class=\"cards\">\n<div class=\"card\"><b>118<\/b><span>official buildings without an OSM pair (of 3,941)<\/span><\/div>\n<div class=\"card\"><b>295<\/b><span>OSM buildings without an official pair (of 3,885)<\/span><\/div>\n<div class=\"card\"><b>75.7 %<\/b><span>official buildings with floors in the register<\/span><\/div>\n<div class=\"card\"><b>3.6 %<\/b><span>OSM buildings with building:levels<\/span><\/div>\n<\/div>\n<div class=\"radios\">\n<label><input type=\"checkbox\" data-q2=\"official\" checked> <i class=\"dot\" style=\"background:#08306b\"><\/i>\nofficial, no OSM pair (118)<\/label>\n<label><input type=\"checkbox\" data-q2=\"osm\" checked> <i class=\"dot\" style=\"background:#ff7f00\"><\/i>\nOSM, no official pair (231)<\/label>\n<label><input type=\"checkbox\" data-q2=\"absent\" checked> <i class=\"dot\" style=\"background:#d81b9a\"><\/i>\nOSM, <b>possibly demolished, not verified<\/b> (64)<\/label>\n<\/div>\n<p>Block colour: share of the official buildings that have an OSM pair (scale from 0.5; blocks without official buildings\nare grey). The largest groups of official buildings without a pair by type: Kõrval- või tootmishoone (104), Vundament (7), Vare (4).<\/p>\n<p>The 64 OSM buildings in magenta carry a <code>maaamet:ETAK<\/code> id that is in no building of the\ncurrent official data; whether they were demolished was not verified. Of the other OSM buildings without a pair,\n224 have no such tag and 7 have an id of a building of the official town layer\nwhose outline does not pair. Sum over the blocks: 118 official and 294 OSM\nbuildings (1 OSM building outside all blocks).<\/p>\n<p class=\"note\">OSM and the official data are not independent: OSM buildings often carry the official ETAK id\n(<code>PLAN.md<\/code> has the counts).<\/p>\n","methods":"\n<h2>Methods &amp; limitations<\/h2>\n<h3>Method<\/h3>\n<ul>\n<li><b>Blocks.<\/b> BlocksNet <code>cut_urban_blocks<\/code> from OSM roads (BlocksNet road types plus\n<code>highway=service<\/code>; no footways or paths) and water. Railways are not used. Islands and slivers without\nbuildings are dropped; blocks over 1 km&sup2; are marked.<\/li>\n<li><b>Buildings<\/b> come from the official ETAK + Building Register layer and from OSM; a building belongs to the block\nthat contains its inside point and is not cut.<\/li>\n<li><b>Floors:<\/b> register value, else height / 3 m (conditional), else 1.<\/li>\n<li><b>Population:<\/b> census 2021 total distributed by registry net area of dwellings.<\/li>\n<li><b>Land use:<\/b> cadastral purpose, class with the largest area share.<\/li>\n<li><b>Accessibility:<\/b> OSM walking network (cycleways without a <code>foot<\/code> tag are assumed walkable),\n5 km/h, shortest of parallel edges; the matrix is stored as <code>float16<\/code>.<\/li>\n<li><b>Schools:<\/b> EHIS schools inside the town; demand = children 7-15 distributed by population; BlocksNet\n<code>competitive_provision<\/code> with thresholds of 10, 15, 20 minutes.<\/li>\n<li><b>Q2:<\/b> pairing by overlap above 50 % of the smaller building.<\/li>\n<\/ul>\n<h3>Limitations<\/h3>\n<ul>\n<li>5 km/h and 3 m per floor are assumptions, not norms.<\/li>\n<li>The block point is snapped to the nearest node of the walking network; for a few blocks the choice of the node\nchanges times by minutes. A few blocks are far from the nearest node of the network.<\/li>\n<li>Large blocks: the block point can lie in a forest.<\/li>\n<li>Land use is legal (cadastre), not actual.<\/li>\n<li>Population per block is a distributed total; the census is from 2021 and the pupils from 2026.<\/li>\n<li>Places of the schools are the pupils, not the capacity; the age of children by block is unknown.<\/li>\n<li>The buildings of the register and OSM are of different dates (OSM was downloaded\n2026-10-30, official buildings 2026-10-30).<\/li>\n<li>The basemap is informative and unofficial (Maa- ja Ruumiamet); it is not part of the analysis.<\/li>\n<\/ul>\n<p class=\"note\">The full list with numbers is in <code>PLAN.md<\/code> in the repository.<\/p>\n","sources":"\n<h2>Data sources &amp; credits<\/h2>\n<p>Details, URLs, licences and download dates of every layer are in <code>data/SOURCES.md<\/code>.<\/p>\n<ul>\n<li><b>OpenStreetMap<\/b>: roads, water, buildings and schools, &copy; OpenStreetMap contributors,\n<a href=\"https://www.openstreetmap.org/copyright\">ODbL<\/a> (downloaded 2026-10-30; roads\n2026-10-31).<\/li>\n<li><b>Maa- ja Ruumiamet<\/b> (Land and Spatial Development Board): settlement boundary (EHAK) and ETAK buildings with\nBuilding Register data, under the\n<a href=\"https://geoportaal.maaruum.ee/opendata-licence\">opendata licence<\/a> of 01.01.2025. <i>ETAK buildings with EHR\ndata and EHAK settlement boundary: Republic of Estonia Land and Spatial Development Board, extract\n30.10.2026.<\/i><\/li>\n<li><b>Cadastral parcels<\/b> (land-use purpose): Maa- ja Ruumiamet cadastre WFS, <a\nhref=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0<\/a>, attributed to the Estonian Ministry of Economic\nAffairs and Communications (downloaded 2026-10-31).<\/li>\n<li><b>Statistics Estonia<\/b>: census 2021 (RL21003, RL21218, RL21807), <a\nhref=\"https://creativecommons.org/licenses/by-sa/4.0/deed.en\">CC BY-SA 4.0<\/a> (downloaded 2026-10-30).<\/li>\n<li><b>EHIS<\/b> (Estonian Education Information System) open data: school buildings and student numbers (downloaded\n2026-10-30). The licence of the student numbers is not stated on the pages checked.<\/li>\n<li><b>Basemap<\/b>: Aluskaart (hallkaart), Maa- ja Ruumiamet 2026; tiles are loaded live from the\nLand and Spatial Development Board. <a href=\"https://geoportaal.maaruum.ee/est/teenused/wms-wfs-wcs-teenused/maa-ja-ruumiameti-kaarditeenuste-kasutustingimused-p24.html\">Terms of the map services<\/a> (in Estonian;\nquoted in <code>data/SOURCES.md<\/code>). The map is informative and unofficial.<\/li>\n<li><b>Leaflet<\/b> 1.9.4, &copy; Volodymyr Agafonkin and CloudMade, BSD 2-Clause licence (embedded in this file with\nits licence).<\/li>\n<\/ul>\n<h3>Credits<\/h3>\n<p><a href=\"https://github.com/aimclub/blocksnet\">BlocksNet<\/a> (version 1.0.0a9, BSD-3-Clause), developed by the\nInstitute of Design and Urban Studies (IDU), ITMO University; installed as a dependency, no code is copied.\nPublication listed by its authors: Churiakova T., Starikov V., Sudakova V., Morozov A., Mityagin S.,\n<a href=\"https://link.springer.com/chapter/10.1007/978-3-031-48855-9_4\">Digital Master Plan as a tool for generating\nterritory development requirements<\/a>, ARTIIS 2023.<\/p>\n<p>Based on practice 2 of the ITMO University course &laquo;Технологии ИИ в урбанистике&raquo; (AI Technologies in\nUrban Studies).<\/p>\n<p>Licences: code under MIT; the terms of each data file are in <a href=\"https://github.com/aleks-nab/haapsalu-urban-blocks/blob/main/data/LICENSE.md\"><code>data/LICENSE.md<\/code><\/a> in the repository.<\/p>\n<p>Code written with the assistance of Claude Code (AI coding agent); research questions, data choices and decisions by the author.<\/p>\n","checks":"\n<h2>Checks<\/h2>\n<p>Each indicator is calculated in the notebook (<code>data/notebook_numbers.json<\/code>) and again by\n<code>build_dashboard.py<\/code> from the data embedded in this page. <b>27 of 27 agree<\/b>.<\/p>\n<div class=\"tw\"><table class=\"checks\"><thead><tr><th>Indicator<\/th><th>Notebook<\/th><th>Dashboard<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td>Population, sum over the blocks (people)<\/td><td>9,595<\/td><td>9,595<\/td><td>OK<\/td><\/tr><tr><td>Population, census 2021 (RL21003)<\/td><td>9,595<\/td><td>9,595<\/td><td>OK<\/td><\/tr><tr><td>Urban blocks<\/td><td>297<\/td><td>297<\/td><td>OK<\/td><\/tr><tr><td>Built-up blocks<\/td><td>222<\/td><td>222<\/td><td>OK<\/td><\/tr><tr><td>Large blocks<\/td><td>2<\/td><td>2<\/td><td>OK<\/td><\/tr><tr><td>Official buildings in town<\/td><td>3,941<\/td><td>3,941<\/td><td>OK<\/td><\/tr><tr><td>OSM buildings in town<\/td><td>3,885<\/td><td>3,885<\/td><td>OK<\/td><\/tr><tr><td>Official buildings without OSM pair (layer)<\/td><td>118<\/td><td>118<\/td><td>OK<\/td><\/tr><tr><td>Official buildings without OSM pair (sum over blocks)<\/td><td>118<\/td><td>118<\/td><td>OK<\/td><\/tr><tr><td>OSM buildings without official pair (layer)<\/td><td>295<\/td><td>295<\/td><td>OK<\/td><\/tr><tr><td>OSM buildings without official pair (sum over blocks)<\/td><td>294<\/td><td>294<\/td><td>OK<\/td><\/tr><tr><td>OSM buildings with an ETAK id absent from official data<\/td><td>64<\/td><td>64<\/td><td>OK<\/td><\/tr><tr><td>Match rate of official buildings, town<\/td><td>0.9701<\/td><td>0.9701<\/td><td>OK<\/td><\/tr><tr><td>Official buildings with floors in the register<\/td><td>0.7567<\/td><td>0.7567<\/td><td>OK<\/td><\/tr><tr><td>OSM buildings with building:levels<\/td><td>0.0360<\/td><td>0.0360<\/td><td>OK<\/td><\/tr><tr><td>Children aged 7-15 (distributed over blocks)<\/td><td>891<\/td><td>891<\/td><td>OK<\/td><\/tr><tr><td>Places in the basic schools (pupils 2026)<\/td><td>880<\/td><td>880<\/td><td>OK<\/td><\/tr><tr><td>Children within 10 min of a basic school, %<\/td><td>42.3<\/td><td>42.3<\/td><td>OK<\/td><\/tr><tr><td>Children within 15 min of a basic school, %<\/td><td>75.1<\/td><td>75.1<\/td><td>OK<\/td><\/tr><tr><td>Children within 20 min of a basic school, %<\/td><td>95.4<\/td><td>95.4<\/td><td>OK<\/td><\/tr><tr><td>Children within 30 min of a basic school, %<\/td><td>100.0<\/td><td>100.0<\/td><td>OK<\/td><\/tr><tr><td>Children within 60 min of a basic school, %<\/td><td>100.0<\/td><td>100.0<\/td><td>OK<\/td><\/tr><tr><td>Provision (strong) of the town, 10 min<\/td><td>0.423<\/td><td>0.423<\/td><td>OK<\/td><\/tr><tr><td>Provision (strong) of the town, 15 min<\/td><td>0.751<\/td><td>0.751<\/td><td>OK<\/td><\/tr><tr><td>Provision (strong) of the town, 20 min<\/td><td>0.921<\/td><td>0.921<\/td><td>OK<\/td><\/tr><tr><td>Median time to the nearest basic school, min<\/td><td>11.4<\/td><td>11.4<\/td><td>OK<\/td><\/tr><tr><td>Longest time to the nearest basic school, min<\/td><td>49.7<\/td><td>49.7<\/td><td>OK<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Numbers taken from the notebook (not recalculated here)<\/h3>\n<div class=\"tw\"><table class=\"\"><thead><tr><th>Number<\/th><th>Value<\/th><th>Used in<\/th><\/tr><\/thead><tbody><tr><td>Pairs of blocks faster by more than 2 min with the cycleways<\/td><td>5,923 of 43,956 (13.5 %)<\/td><td>Key findings<\/td><\/tr><tr><td>Vacant dwelling area, census 2021 (RL21218)<\/td><td>91,362 of 377,891 m² (24 %)<\/td><td>Key findings<\/td><\/tr><tr><td>Population from net dwelling area / from footprint × floors<\/td><td>16,581 / 24,189 people<\/td><td>Population, Key findings<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"note\">To re-run: execute <code>notebook.ipynb<\/code> (it rewrites <code>data/<\/code>), then\n<code>python build_dashboard.py<\/code>.<\/p>\n"}}</script>
